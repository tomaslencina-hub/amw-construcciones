<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles.css" />
    <title>Presupuesto AMW</title>
  </head>
<body>
  <div class="app-shell">

    <!-- Menú lateral -->
    <nav class="sidebar">
      <div class="sidebar-brand">
        <img src="src/assets/AMW-logo-header.jpeg" alt="Logo AMW" class="sidebar-logo" />
        <div>
          <strong>A.M.W.</strong>
          <span>Sistema de presupuestos</span>
        </div>
      </div>

      <div class="sidebar-nav">
        <button class="nav-item active" data-view="presupuesto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z" />
            <line x1="9" y1="8" x2="15" y2="8" />
            <line x1="9" y1="12" x2="15" y2="12" />
          </svg>
          Presupuesto
        </button>

        <button class="nav-item" data-view="clientes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8" r="3" />
            <path d="M3 20c0-3 2.5-5 6-5s6 2 6 5" />
            <circle cx="17.5" cy="9" r="2.3" />
            <path d="M15.8 20c.2-2.1 1.5-3.7 3.4-4.2" />
          </svg>
          Clientes
        </button>

        <button class="nav-item" data-view="proveedores">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="7" width="13" height="9" rx="1" />
            <path d="M14 10h4l3 3v3h-7z" />
            <circle cx="6" cy="18" r="1.6" />
            <circle cx="17.5" cy="18" r="1.6" />
          </svg>
          Proveedores
        </button>
      </div>

      <!-- Cierra la app (la ventana no tiene barra de título propia) -->
      <button id="btn-cerrar-app" class="btn-cerrar-app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v9" />
          <path d="M6.3 7.2a8 8 0 1 0 11.4 0" />
        </svg>
        Cerrar
      </button>
    </nav>

    <!-- Contenido -->
    <div class="app-main">

      <!-- Barra superior: se puede arrastrar para mover la ventana -->
      <div class="app-topbar" data-tauri-drag-region>
        <button id="btn-minimizar" class="btn-minimizar" aria-label="Minimizar" title="Minimizar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="6" y1="12" x2="18" y2="12" />
          </svg>
        </button>
      </div>

      <div class="app-content">

      <!-- Vista: Presupuesto -->
      <section class="view" id="view-presupuesto">
        <h1 class="view-title">Presupuesto</h1>

        <div class="dashboard">

          <!-- IZQUIERDA -->
          <div class="left-column">

            <!-- Las tareas se arman dinámicamente en formulario.ts -->
            <div id="tareas-contenedor"></div>

            <button id="add-tarea" class="btn-agregar-tarea">
              + Agregar tarea
            </button>

          </div>

          <!-- DERECHA -->
          <div class="right-column">

          <!-- Cliente -->
          <div class="card">

            <h2>
              <span class="icon-badge icon-client" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="4" width="14" height="17" rx="2" />
                  <rect x="9" y="2" width="6" height="4" rx="1" />
                  <line x1="8" y1="11" x2="16" y2="11" />
                  <line x1="8" y1="15" x2="14" y2="15" />
                </svg>
              </span>
              Datos del Cliente
            </h2>

            <div class="input-group">
              <label>Cliente</label>
              <input
                type="text"
                id="cliente"
                placeholder="Nombre completo"
              >
            </div>

            <div class="input-group">
              <label>Fecha</label>
              <input
                type="date"
                id="fecha"
              >
            </div>

            <div class="input-group">
              <label>Observaciones</label>

              <textarea
                id="observaciones"
                rows="3"
                placeholder="Ej: El presupuesto no incluye pintura, plazo estimado 15 días, etc."
              ></textarea>
            </div>

          </div>

          <!-- Diseño del PDF: A.M.W. u otro emisor (se arma en emisor.ts) -->
          <div class="card card-emisor">

            <h2>
              <span class="icon-badge icon-client" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                  <path d="M14 2v6h6" />
                  <line x1="8" y1="13" x2="16" y2="13" />
                  <line x1="8" y1="17" x2="13" y2="17" />
                </svg>
              </span>
              Diseño del PDF
            </h2>

            <div class="segmentado" role="radiogroup" aria-label="Diseño del PDF">
              <button type="button" class="segmento" role="radio" data-emisor="amw">
                A.M.W.
              </button>
              <button type="button" class="segmento" role="radio" data-emisor="otro">
                Otro emisor
              </button>
            </div>

            <div id="emisor-campos" class="emisor-campos" hidden>
              <div class="input-group">
                <label for="emisor-nombre">Nombre y apellido</label>
                <input type="text" id="emisor-nombre" placeholder="Quien emite el presupuesto">
              </div>

              <div class="emisor-fila">
                <div class="input-group">
                  <label for="emisor-dni">DNI</label>
                  <input type="text" id="emisor-dni" placeholder="Opcional">
                </div>

                <div class="input-group">
                  <label for="emisor-cuit">CUIT</label>
                  <input type="text" id="emisor-cuit" placeholder="Opcional">
                </div>
              </div>

              <div class="input-group">
                <label for="emisor-telefono">Teléfono</label>
                <input type="text" id="emisor-telefono" placeholder="Opcional">
              </div>
            </div>

          </div>

            <!-- Totales -->
            <div class="card total-container">

              <h2>
                <span class="icon-badge icon-summary" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z" />
                    <line x1="9" y1="8" x2="15" y2="8" />
                    <line x1="9" y1="12" x2="15" y2="12" />
                  </svg>
                </span>
                Resumen
              </h2>

              <div class="total-row">
                <span>Mano de Obra</span>
                <strong id="sub-mano">
                  $ 0.00
                </strong>
              </div>

              <div class="total-row">
                <span>Materiales</span>
                <strong id="sub-materiales">
                  $ 0.00
                </strong>
              </div>

              <hr>

              <div class="total-row final">
                <span>Total</span>
                <strong id="total-final">
                  $ 0.00
                </strong>
              </div>

              <div class="acciones">

                <button id="btn-preview" class="btn-preview">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  Vista previa
                </button>

                <button id="btn-pdf" class="btn-generar">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <path d="M14 2v6h6" />
                    <path d="M9 13l3 3 3-3" />
                    <line x1="12" y1="11" x2="12" y2="16" />
                  </svg>
                  Descargar PDF
                </button>

                <button id="btn-print" class="btn-print">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 9V3h12v6" />
                    <rect x="4" y="9" width="16" height="8" rx="1" />
                    <path d="M6 17v4h12v-4" />
                  </svg>
                  Imprimir
                </button>

              </div>

            </div>

          </div>

        </div>
      </section>

      <!-- Vista: Clientes -->
      <section class="view" id="view-clientes" hidden>
        <div class="view-header">
          <h1 class="view-title">Clientes</h1>
          <span id="clientes-contador" class="view-contador"></span>
        </div>

        <div class="buscador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="20" y1="20" x2="16" y2="16" />
          </svg>
          <input
            type="search"
            id="clientes-filtro"
            placeholder="Buscar por nombre del cliente"
          >
        </div>

        <!-- Las filas se arman dinámicamente en clientes.ts -->
        <div id="clientes-lista" class="clientes-lista"></div>

        <p id="clientes-vacio" class="clientes-vacio" hidden></p>
      </section>

      <!-- Vista: Proveedores (placeholder) -->
      <section class="view" id="view-proveedores" hidden>
        <div class="view-header">
          <h1 class="view-title">Proveedores</h1>
          <button id="btn-nuevo-proveedor" class="btn-primary">
            + Nuevo proveedor
          </button>
        </div>

        <!-- Busca un material en todos los proveedores y compara precios -->
        <div class="buscador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="20" y1="20" x2="16" y2="16" />
          </svg>
          <input
            type="search"
            id="buscar-material"
            placeholder="Buscar un material en todos los proveedores (ej: cable)"
          >
        </div>

        <!-- Las tarjetas y resultados se arman dinámicamente en proveedores.ts -->
        <div id="proveedores-resultados" class="proveedores-resultados" hidden></div>
        <div id="proveedores-grid" class="proveedores-grid"></div>

        <p id="proveedores-vacio" class="clientes-vacio" hidden></p>
      </section>

      </div>

    </div>

  </div>

  <!-- Modal -->

  <div id="modal-preview" class="modal">

    <div class="modal-content">

      <span
        id="cerrar-modal"
        class="close"
      >
        &times;
      </span>

      <div id="preview-content"></div>

    </div>

  </div>

  <script type="module" src="/src/main.ts"></script>

</body>
</html>
